<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Omran Caption</title>
<meta name="description" content="ترجمة نصوص حية فورية للصوت + ترجمة لأي لغة - by عمران" />
<meta name="theme-color" content="#1a73e8" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/favicon-32.png" />
<style>
  :root{
    --bg:#0b0c10;
    --panel:#16181d;
    --panel2:#1e2127;
    --border:#2a2d34;
    --text:#e8eaed;
    --muted:#9aa0a6;
    --accent:#1a73e8;
    --accent2:#8ab4f8;
    --danger:#ea4335;
    --gold:#fbbc04;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI",Tahoma,"Cairo",system-ui,sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  [dir="ltr"] body{font-family:"Segoe UI",system-ui,sans-serif;}

  #bgCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    display:block;
    background:radial-gradient(ellipse at 50% 20%,#101823 0%,#0b0c10 60%);
  }
  header, main, footer{position:relative;z-index:1;}
  header{background:rgba(22,24,29,.72);backdrop-filter:blur(6px);}
  .cc-stage, .selector-box, .usage-note{backdrop-filter:blur(2px);}

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 16px;
    border-bottom:1px solid var(--border);
    background:var(--panel);
    position:sticky;
    top:0;
    z-index:10;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .cc{
    width:34px;height:34px;border-radius:8px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:14px;color:#fff;letter-spacing:-1px;
  }
  .brand-name{font-weight:700;font-size:16px;}
  .brand-name small{display:block;font-weight:400;font-size:11px;color:var(--muted);}

  .header-actions{display:flex;align-items:center;gap:8px;}
  .lang-toggle{
    display:flex;border:1px solid var(--border);border-radius:20px;overflow:hidden;
  }
  .lang-toggle button{
    background:transparent;border:none;color:var(--muted);padding:6px 12px;font-size:12px;cursor:pointer;
  }
  .lang-toggle button.active{background:var(--accent);color:#fff;}

  .premium-btn{
    background:linear-gradient(135deg,var(--gold),#f29900);
    color:#1a1a1a;border:none;border-radius:20px;
    padding:7px 16px;font-weight:700;font-size:12.5px;cursor:pointer;
    display:flex;align-items:center;gap:6px;
    box-shadow:0 2px 8px rgba(251,188,4,.3);
  }
  .premium-btn:hover{filter:brightness(1.05);}

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 32px;
    gap:22px;
    max-width:720px;
    width:100%;
    margin:0 auto;
  }

  .selectors{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .selector-box{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:10px 12px;
  }
  .selector-box label{
    display:block;font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600;
  }
  .selector-box select{
    width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--border);
    border-radius:10px;padding:9px 10px;font-size:13.5px;outline:none;cursor:pointer;
  }
  .selector-box select:focus{border-color:var(--accent);}

  .swap-btn{
    align-self:center;
    background:var(--panel2);border:1px solid var(--border);color:var(--accent2);
    width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px;
    display:flex;align-items:center;justify-content:center;margin:-6px auto 0;
  }

  .cc-stage{
    width:100%;
    min-height:180px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:10px;
    position:relative;
  }
  .cc-stage.idle{align-items:center;justify-content:center;color:var(--muted);font-size:14px;text-align:center;}
  .cc-line{
    font-size:20px;
    line-height:1.5;
    font-weight:500;
  }
  .cc-line.original{color:var(--muted);font-size:14px;}
  .cc-line.translated{color:var(--text);font-size:22px;font-weight:600;}
  .cc-stage:not(.idle){justify-content:flex-start;max-height:58vh;overflow-y:auto;}
  .cc-stage:not(.idle) > div:first-of-type{margin-top:auto;}
  .cc-entry{display:flex;flex-direction:column;gap:2px;opacity:.5;transition:opacity .3s;}
  .cc-entry.latest{opacity:1;}
  .cc-entry:not(.latest) .cc-line.translated{font-size:16px;}
  .cc-entry:not(.latest) .cc-line.original{font-size:12px;}
  .cc-tag{font-size:10px;color:var(--accent2);font-weight:700;letter-spacing:.5px;direction:ltr;align-self:flex-start;}
  .cc-badge{
    position:absolute;top:10px;inset-inline-end:14px;
    font-size:10px;color:var(--muted);
    display:flex;align-items:center;gap:5px;
  }
  .cc-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--danger);animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  .main-btn-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:6px;}
  .main-btn{
    width:96px;height:96px;border-radius:50%;
    background:var(--accent);
    border:none;color:#fff;font-size:34px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 4px 20px rgba(26,115,232,.4);
    transition:transform .15s, background .2s;
  }
  .main-btn:active{transform:scale(.94);}
  .main-btn.recording{
    background:var(--danger);
    box-shadow:0 0 0 8px rgba(234,67,53,.15), 0 4px 20px rgba(234,67,53,.4);
    animation:ring 1.4s infinite;
  }
  @keyframes ring{
    0%{box-shadow:0 0 0 0 rgba(234,67,53,.35), 0 4px 20px rgba(234,67,53,.4);}
    70%{box-shadow:0 0 0 14px rgba(234,67,53,0), 0 4px 20px rgba(234,67,53,.4);}
    100%{box-shadow:0 0 0 0 rgba(234,67,53,0), 0 4px 20px rgba(234,67,53,.4);}
  }
  .main-btn-label{font-size:13.5px;color:var(--muted);font-weight:600;}

  .usage-note{font-size:11.5px;color:var(--muted);text-align:center;}
  .install-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .ghost-btn{
    background:transparent;border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:8px 14px;font-size:12.5px;cursor:pointer;
  }
  .ghost-btn:hover{border-color:var(--accent);color:var(--accent2);}

  footer{
    text-align:center;padding:14px;color:var(--muted);font-size:11.5px;border-top:1px solid var(--border);
    background:rgba(22,24,29,.6);backdrop-filter:blur(6px);
  }
  footer b{color:var(--text);}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:10px 18px;border-radius:10px;font-size:13px;z-index:50;
    box-shadow:0 6px 24px rgba(0,0,0,.4);
    max-width:90vw;text-align:center;
  }

  @media (max-width:520px){
    .selectors{grid-template-columns:1fr;}
    .swap-btn{transform:rotate(90deg);margin:0 auto;}
    .cc-line.translated{font-size:19px;}
  }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<header>
  <div class="brand">
    <div class="cc">CC</div>
    <div class="brand-name" id="brandName">Omran Caption<small id="brandTag">ترجمة حية فورية - by عمران</small></div>
  </div>
  <div class="header-actions">
    <div class="lang-toggle">
      <button id="uiArBtn" class="active">ARB</button>
      <button id="uiEnBtn">ENG</button>
    </div>
    <button class="premium-btn" id="premiumBtn">⭐ <span id="premiumLabel">Go Premium</span></button>
  </div>
</header>

<main>
  <div class="selectors">
    <div class="selector-box">
      <label id="lblSource">🎙️ لغة التحدث (Captioning language)</label>
      <select id="sourceLang"></select>
    </div>
    <div class="selector-box">
      <label id="lblTarget">🌐 لغة الترجمة (Translation language)</label>
      <select id="targetLang"></select>
    </div>
  </div>

  <button class="swap-btn" id="swapBtn" title="تبديل">⇄</button>

  <div class="cc-stage idle" id="ccStage">
    <span id="ccIdleText">اضغط الزر أدناه لبدء الترجمة الحية / Press the button below to start live captioning</span>
  </div>

  <div class="main-btn-wrap">
    <button class="main-btn" id="mainBtn">🎤</button>
    <div class="main-btn-label" id="mainBtnLabel">اضغط لبدء الترجمة الحية / Click to Live Caption</div>
  </div>

  <div class="usage-note" id="usageNote"></div>

  <div class="install-row">
    <button class="ghost-btn" id="installBtn" style="display:none;">📲 تثبيت التطبيق / Install App</button>
  </div>
</main>

<footer>
  <b>Omran Caption</b> — ترجمة حية فورية لكل اللغات · by عمران
</footer>

<script>
(function(){
  // v-api-base: داخل تطبيق iOS (Capacitor) تُحمَّل الصفحة من capacitor://localhost
  // فلا يوجد خادم محلي؛ الطلب النسبي /api/caption يفشل صامتًا وتتعطّل الترجمة.
  // نوجّه الطلبات إلى خادم الإنتاج عند عدم كون البروتوكول http(s).
  const API_BASE = /^https?:$/.test(location.protocol) ? '' : 'https://omran-caption.vercel.app';
  const LANGS = [
    ["auto","تلقائي / Auto Detect"],["ar","العربية / Arabic"],["en","English"],["fr","Français / French"],
    ["es","Español / Spanish"],["de","Deutsch / German"],["it","Italiano / Italian"],["pt","Português / Portuguese"],
    ["ru","Русский / Russian"],["zh","中文 / Chinese"],["ja","日本語 / Japanese"],["ko","한국어 / Korean"],
    ["hi","हिन्दी / Hindi"],["ur","اردو / Urdu"],["fa","فارسی / Persian"],["tr","Türkçe / Turkish"],
    ["nl","Nederlands / Dutch"],["pl","Polski / Polish"],["sv","Svenska / Swedish"],["el","Ελληνικά / Greek"],
    ["he","עברית / Hebrew"],["th","ไทย / Thai"],["vi","Tiếng Việt / Vietnamese"],["id","Indonesia"],
    ["ms","Melayu / Malay"],["bn","বাংলা / Bengali"],["ta","தமிழ் / Tamil"],["ml","മലയാളം / Malayalam"],
    ["ku","کوردی / Kurdish"],["sw","Kiswahili / Swahili"],["am","አማርኛ / Amharic"],["uk","Українська / Ukrainian"],
    ["ro","Română / Romanian"],["hu","Magyar / Hungarian"],["cs","Čeština / Czech"],["fi","Suomi / Finnish"],
    ["da","Dansk / Danish"],["no","Norsk / Norwegian"],["sk","Slovenčina / Slovak"],["bg","Български / Bulgarian"],
    ["sr","Српски / Serbian"],["hr","Hrvatski / Croatian"],["lt","Lietuvių / Lithuanian"],["lv","Latviešu / Latvian"],
    ["et","Eesti / Estonian"],["az","Azərbaycan / Azerbaijani"],["ka","ქართული / Georgian"],["hy","Հայերեն / Armenian"],
    ["km","ខ្មែរ / Khmer"],["lo","ລາວ / Lao"],["my","မြန်မာ / Burmese"],["ne","नेपाली / Nepali"],
    ["si","සිංහල / Sinhala"],["ps","پښتو / Pashto"],["so","Soomaali / Somali"],["ha","Hausa"],
    ["yo","Yorùbá / Yoruba"],["zu","isiZulu / Zulu"],["af","Afrikaans"],["sq","Shqip / Albanian"],
    ["mk","Македонски / Macedonian"],["mn","Монгол / Mongolian"],["tl","Filipino"],
  ];
  // Target list should not include "auto" (need a concrete target language).
  const TARGET_LANGS = LANGS.filter(([c]) => c !== 'auto');

  const $ = (id) => document.getElementById(id);
  const sourceSel = $('sourceLang');
  const targetSel = $('targetLang');
  const mainBtn = $('mainBtn');
  const mainBtnLabel = $('mainBtnLabel');
  const ccStage = $('ccStage');
  const usageNote = $('usageNote');

  function fillSelect(sel, list, def){
    sel.innerHTML = '';
    list.forEach(([code, label]) => {
      const opt = document.createElement('option');
      opt.value = code; opt.textContent = label;
      if (code === def) opt.selected = true;
      sel.appendChild(opt);
    });
  }
  fillSelect(sourceSel, LANGS, 'auto');
  fillSelect(targetSel, TARGET_LANGS, 'en');

  const savedSrc = localStorage.getItem('oc_sourceLang');
  const savedTgt = localStorage.getItem('oc_targetLang');
  if (savedSrc) sourceSel.value = savedSrc;
  if (savedTgt) targetSel.value = savedTgt;
  sourceSel.addEventListener('change', () => localStorage.setItem('oc_sourceLang', sourceSel.value));
  targetSel.addEventListener('change', () => localStorage.setItem('oc_targetLang', targetSel.value));

  $('swapBtn').addEventListener('click', () => {
    const s = sourceSel.value === 'auto' ? 'en' : sourceSel.value;
    const t = targetSel.value;
    if (LANGS.some(([c]) => c === t)) sourceSel.value = t;
    targetSel.value = s;
    localStorage.setItem('oc_sourceLang', sourceSel.value);
    localStorage.setItem('oc_targetLang', targetSel.value);
  });

  // ---------------- UI language (interface only, AR/EN) ----------------
  const UI_TEXT = {
    ar: {
      brandTag: 'ترجمة حية فورية - by عمران',
      lblSource: '🎙️ لغة التحدث (Captioning language)',
      lblTarget: '🌐 لغة الترجمة (Translation language)',
      ccIdle: 'اضغط الزر أدناه لبدء الترجمة الحية / Press the button below to start live captioning',
      mainBtnLabel: 'اضغط لبدء الترجمة الحية / Click to Live Caption',
      mainBtnLabelStop: 'اضغط للإيقاف / Click to stop',
      premium: 'اشترك الآن',
      install: '📲 تثبيت التطبيق',
      micDenied: 'تم رفض إذن الميكروفون. فعّله من إعدادات المتصفح.',
    },
    en: {
      brandTag: 'Live captioning & translation - by Omran',
      lblSource: '🎙️ Captioning language',
      lblTarget: '🌐 Translation language',
      ccIdle: 'Press the button below to start live captioning',
      mainBtnLabel: 'Click to Live Caption',
      mainBtnLabelStop: 'Click to stop',
      premium: 'Go Premium',
      install: '📲 Install App',
      micDenied: 'Microphone permission denied. Enable it in your browser settings.',
    },
  };
  let uiLang = localStorage.getItem('oc_uiLang') || 'ar';

  function applyUiLang(){
    const t = UI_TEXT[uiLang];
    document.documentElement.lang = uiLang;
    document.documentElement.dir = uiLang === 'ar' ? 'rtl' : 'ltr';
    $('brandTag').textContent = t.brandTag;
    $('lblSource').textContent = t.lblSource;
    $('lblTarget').textContent = t.lblTarget;
    if (!recording) $('ccIdleText').textContent = t.ccIdle;
    mainBtnLabel.textContent = recording ? t.mainBtnLabelStop : t.mainBtnLabel;
    $('premiumLabel').textContent = t.premium;
    $('installBtn').textContent = t.install;
    $('uiArBtn').classList.toggle('active', uiLang === 'ar');
    $('uiEnBtn').classList.toggle('active', uiLang === 'en');
  }
  $('uiArBtn').addEventListener('click', () => { uiLang = 'ar'; localStorage.setItem('oc_uiLang','ar'); applyUiLang(); });
  $('uiEnBtn').addEventListener('click', () => { uiLang = 'en'; localStorage.setItem('oc_uiLang','en'); applyUiLang(); });

  // ---------------- Guest id ----------------
  function genId(){ return 'g_' + Math.random().toString(36).slice(2) + Date.now().toString(36); }
  let guestId = localStorage.getItem('oc_guestId');
  if (!guestId) { guestId = genId(); localStorage.setItem('oc_guestId', guestId); }

  // ---------------- Recording ----------------
  // v-keep-open: التسجيل يبقى مفتوحًا حتى يضغط المستخدم إيقاف:
  //  - إذا انقطع الميكروفون (مكالمة، Siri، تطبيق آخر، قفل الشاشة) نعيد فتحه تلقائيًا
  //    بدل أن يبقى الزر أحمر والترجمة متوقفة صامتًا.
  //  - الشاشة تبقى مضاءة أثناء التسجيل (Wake Lock على الويب + idle timer في iOS).
  //  - حلقة تسجيل واحدة فقط (الـ watchdog كان يشغّل حلقة ثانية موازية).
  let recording = false;
  let session = 0;          // يزيد مع كل تشغيل/إيقاف؛ أي callback قديم يُتجاهل
  let mediaStream = null;
  let mediaRecorder = null;
  let chunkTimer = null;
  let reopening = false;
  let lastLoopAt = 0;
  let chunkSeq = 0;         // ترتيب المقاطع المرسلة
  let lastQuotaToast = 0;
  const CHUNK_MS = 3500;    // طول المقطع الثابت إذا لم يتوفر كشف الصوت
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // v-vad: نقطع التسجيل عند توقف المتكلم (نهاية الجملة) بدل كل 3.5 ثانية،
  // فلا تنقطع الكلمات في النص ويفهم Whisper الجملة كاملة، ولا نرسل الصمت.
  const MIN_MS = 1200;      // أقصر مقطع
  const MAX_MS = 9000;      // أطول مقطع (حتى لا يتأخر النص إذا لم يتوقف المتكلم)
  const PAUSE_MS = 700;     // سكوت بعد الكلام = نهاية الجملة
  const IDLE_MS = 6000;     // مقطع صامت بالكامل: يُرمى ونبدأ من جديد
  const MIN_SPEECH_MS = 250;
  const TICK_MS = 50;
  let audioCtx = null, analyser = null, vadSource = null, vadBuf = null;
  let noiseFloor = 0.002, vadAlive = false;

  // ---------------- Conversation view ----------------
  const MAX_LINES = 4;
  let lines = [];           // آخر سطور المحادثة {seq, original, translated, from, to}

  function showToast(msg, ms){
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), ms || 4000);
  }

  function pickMime(){
    const candidates = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
    for (const c of candidates){
      if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
    }
    return '';
  }

  function blobToBase64(blob){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(String(reader.result).split(',')[1] || '');
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  // نعرض آخر سطور المحادثة (الأحدث بالأسفل) بدل سطر واحد يتبدل كل ثوانٍ.
  // الردود المتأخرة تدخل في مكانها حسب ترتيبها فلا تضيع جملة.
  function addLine(entry){
    lines.push(entry);
    lines.sort((a, b) => a.seq - b.seq);
    if (lines.length > MAX_LINES) lines = lines.slice(-MAX_LINES);
    renderStage();
  }

  function renderStage(){
    ccStage.classList.remove('idle');
    const body = lines.length ? lines.map((l, i) => {
      const tag = (l.from && l.to && l.from !== l.to)
        ? '<div class="cc-tag">' + escapeHtml(l.from.toUpperCase() + ' → ' + l.to.toUpperCase()) + '</div>' : '';
      return '<div class="cc-entry' + (i === lines.length - 1 ? ' latest' : '') + '">' + tag +
        (l.original && l.original !== l.translated ? '<div class="cc-line original" dir="auto">' + escapeHtml(l.original) + '</div>' : '') +
        '<div class="cc-line translated" dir="auto">' + escapeHtml(l.translated || '…') + '</div></div>';
    }).join('') : '<div class="cc-line translated">…</div>';
    ccStage.innerHTML = '<span class="cc-badge"><span class="dot"></span>LIVE</span>' + body;
    ccStage.scrollTop = ccStage.scrollHeight;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function sendChunk(blob, mimeType, mySession){
    const seq = ++chunkSeq;
    try {
      const audioBase64 = await blobToBase64(blob);
      if (!audioBase64 || mySession !== session) return;
      const src = sourceSel.value, tgt = targetSel.value;
      const post = () => fetch(API_BASE + '/api/caption', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          audioBase64, mimeType,
          sourceLang: src,
          targetLang: tgt,
          // محادثة: إذا اخترت اللغتين، من يتكلم لغة الترجمة يُترجم كلامه للغتك.
          twoWay: src !== 'auto',
          // آخر الجمل تساعد المترجم يفهم سياق المحادثة.
          context: lines.slice(-3).map((l) => l.original).filter(Boolean),
          guestId,
        }),
      });
      let resp = await post();
      if (resp.status === 402) {
        // استخدام خاص بلا حد يومي. إذا كان الخادم ما زال يطبّق الحد القديم
        // نبدّل المعرّف ونعيد نفس المقطع بدل إيقاف التسجيل.
        guestId = genId();
        localStorage.setItem('oc_guestId', guestId);
        resp = await post();
      }
      if (!resp.ok) {
        const data = await resp.json().catch(() => ({}));
        if (resp.status === 429) {
          // رصيد Groq: نوضح السبب بدل ما يبدو التطبيق واقفًا (مرة كل 20 ثانية).
          if (Date.now() - lastQuotaToast > 20000) { lastQuotaToast = Date.now(); showToast(data.error || 'Groq rate limit', 6000); }
        } else if (Date.now() - lastQuotaToast > 20000) {
          lastQuotaToast = Date.now();
          showToast('⚠️ ' + (data.error || ('Server error ' + resp.status)).slice(0, 160), 6000);
        }
        return;
      }
      const data = await resp.json();
      // الرد وصل بعد الإيقاف: لا نكتب على الشاشة.
      if (!recording || mySession !== session) return;
      const from = data.detectedLang || '', to = data.toLang || '';
      // v-show-err: نعرض سبب فشل الترجمة إن وُجد بدل تجاهله (كان السيرفر
      // يرسله والعميل يهمله فيبدو النص عالقًا بلا تفسير).
      if (data.translationError) {
        addLine({ seq, original: data.original, translated: '⚠️ ' + data.translationError, from, to });
      } else if (data.original || data.translated) {
        addLine({ seq, original: data.original, translated: data.translated, from, to });
      }
    } catch (e) {
      // transient network hiccup; keep loop alive
    }
  }

  function streamAlive(){
    return !!mediaStream && mediaStream.getAudioTracks().some((t) => t.readyState === 'live');
  }

  async function openMic(){
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    // 'ended' = انقطاع من خارج التطبيق (مكالمة، Siri، تطبيق آخر أخذ الميكروفون).
    // إيقافنا نحن عبر track.stop() لا يطلق هذا الحدث.
    s.getAudioTracks().forEach((t) => t.addEventListener('ended', () => {
      if (recording && mediaStream === s) reopenMic();
    }));
    attachVad(s);
    return s;
  }

  // ---------------- Voice activity detection ----------------
  // يُستدعى داخل ضغطة الزر مباشرة (iOS يسمح بتشغيل الصوت فقط بعد لمسة المستخدم).
  function ensureAudioCtx(){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state !== 'running') audioCtx.resume().catch(() => {});
    } catch(e){ audioCtx = null; }
  }

  function attachVad(stream){
    if (!audioCtx) return;
    try {
      if (vadSource) vadSource.disconnect();
      vadSource = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      vadBuf = new Float32Array(analyser.fftSize);
      // لا نوصله بالسماعة: AnalyserNode يُعالج بدونها، وهكذا لا نغيّر جلسة الصوت في iOS.
      vadSource.connect(analyser);
      vadAlive = false;
    } catch(e){ analyser = null; }
  }

  // مستوى الصوت الحالي (RMS)، أو -1 إذا كشف الصوت غير متاح فنرجع للمقاطع الثابتة.
  function micLevel(){
    if (!analyser || !audioCtx || audioCtx.state !== 'running') return -1;
    analyser.getFloatTimeDomainData(vadBuf);
    let sum = 0;
    for (let i = 0; i < vadBuf.length; i++) sum += vadBuf[i] * vadBuf[i];
    const rms = Math.sqrt(sum / vadBuf.length);
    if (rms > 0.003) vadAlive = true;
    return vadAlive ? rms : -1;
  }

  function releaseMic(){
    if (mediaStream) mediaStream.getTracks().forEach((t) => { try { t.stop(); } catch(e){} });
    mediaStream = null;
  }

  // يعيد فتح الميكروفون بمحاولات متكررة حتى ينجح أو يضغط المستخدم إيقاف.
  async function reopenMic(){
    if (!recording || reopening) return;
    reopening = true;
    const mySession = session;
    const old = mediaRecorder; mediaRecorder = null;
    if (chunkTimer) clearTimeout(chunkTimer);
    try { if (old && old.state !== 'inactive') old.stop(); } catch(e){}
    releaseMic();
    let delay = 500;
    try {
      while (recording && mySession === session) {
        // في الخلفية لا يعطي iOS الميكروفون؛ نكمل عند الرجوع (visibilitychange).
        if (document.hidden) return;
        try {
          const s = await openMic();
          if (!recording || mySession !== session) { s.getTracks().forEach((t) => t.stop()); return; }
          mediaStream = s;
          break;
        } catch (e) {
          if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) {
            showToast(UI_TEXT[uiLang].micDenied, 5000);
            stopRecording();
            return;
          }
          await sleep(delay);
          delay = Math.min(delay * 2, 8000);
        }
      }
    } finally {
      reopening = false;
    }
    if (recording && mySession === session && mediaStream) recordLoop();
  }

  function recordLoop(){
    if (!recording) return;
    lastLoopAt = Date.now();
    if (!streamAlive()) { reopenMic(); return; }
    const mySession = session;
    const mimeType = pickMime();
    const startedAt = Date.now();
    let usedVad = false, speechMs = 0, lastSpeechAt = 0;
    let recorder;
    try {
      recorder = new MediaRecorder(mediaStream, mimeType ? { mimeType } : undefined);
      mediaRecorder = recorder;
      const chunks = [];
      recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        // مقطع صامت (لا كلام، أو iOS كتم الميكروفون في مكالمة/خلفية): لا نرسله.
        const muted = !mediaStream || mediaStream.getAudioTracks().every((t) => t.muted);
        const hadSpeech = !usedVad || speechMs >= MIN_SPEECH_MS;
        if (mySession === session && chunks.length && !muted && hadSpeech) {
          const type = mimeType || recorder.mimeType || 'audio/webm';
          sendChunk(new Blob(chunks, { type }), type, mySession);
        }
        // نكمل فقط إذا كان هذا المسجّل هو الحالي — يمنع تشغيل حلقتين بالتوازي.
        if (recording && mySession === session && recorder === mediaRecorder) recordLoop();
      };
      recorder.onerror = () => { try { if (recorder.state !== 'inactive') recorder.stop(); } catch(e){} };
      recorder.start();
    } catch (e) {
      if (mediaRecorder === recorder) mediaRecorder = null;
      reopenMic();
      return;
    }
    const stopIt = () => { try { if (recorder.state !== 'inactive') recorder.stop(); } catch(e){} };
    // كل 50ms: هل يتكلم أحد؟ نقطع عند أول سكتة بعد الكلام (نهاية الجملة).
    const tick = () => {
      if (recorder.state === 'inactive' || recorder !== mediaRecorder) return;
      const now = Date.now(), elapsed = now - startedAt;
      const level = micLevel();
      if (level >= 0) {
        usedVad = true;
        // العتبة تتكيف مع ضجيج المكان، وتبقى منخفضة لالتقاط المتكلم البعيد.
        if (level < noiseFloor) noiseFloor += (level - noiseFloor) * 0.2;
        else noiseFloor += (level - noiseFloor) * 0.002;
        noiseFloor = Math.min(Math.max(noiseFloor, 0.0005), 0.02);
        const threshold = Math.max(0.004, noiseFloor * 2.5);
        if (level > threshold) { speechMs += TICK_MS; lastSpeechAt = now; }
        const endOfPhrase = speechMs >= MIN_SPEECH_MS && now - lastSpeechAt >= PAUSE_MS && elapsed >= MIN_MS;
        const silentChunk = speechMs < MIN_SPEECH_MS && elapsed >= IDLE_MS;
        if (endOfPhrase || silentChunk || elapsed >= MAX_MS) return stopIt();
      } else if (elapsed >= CHUNK_MS) {
        return stopIt(); // بدون كشف صوت: مقاطع ثابتة كالسابق
      }
      chunkTimer = setTimeout(tick, TICK_MS);
    };
    chunkTimer = setTimeout(tick, TICK_MS);
  }

  // فحص دوري + عند الرجوع للتطبيق: يعيد الميكروفون أو الحلقة إن تعطّلت،
  // فلا يبقى الزر أحمر والترجمة متوقفة.
  let mutedSince = 0;
  function checkHealth(){
    if (!recording || reopening || document.hidden) return;
    if (!streamAlive()) { reopenMic(); return; }
    const muted = mediaStream.getAudioTracks().every((t) => t.muted);
    mutedSince = muted ? (mutedSince || Date.now()) : 0;
    if (muted && Date.now() - mutedSince > 8000) { mutedSince = 0; reopenMic(); return; }
    // iOS يوقف AudioContext بعد المقاطعات؛ نعيد تشغيله لكشف الكلام.
    if (audioCtx && audioCtx.state !== 'running') audioCtx.resume().catch(() => {});
    if (Date.now() - lastLoopAt > MAX_MS + 5000) {
      const stuck = mediaRecorder; mediaRecorder = null;
      try { if (stuck && stuck.state !== 'inactive') stuck.stop(); } catch(e){}
      recordLoop();
    }
  }
  setInterval(checkHealth, 2000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !recording) return;
    keepScreenOn(true); // المتصفح يحرر قفل الشاشة تلقائيًا عند الإخفاء
    checkHealth();
  });

  // ---------------- Keep screen on while recording ----------------
  // iOS يقفل الشاشة بعد ثوانٍ فيتوقف الميكروفون والترجمة.
  let wakeLock = null;
  async function keepScreenOn(on){
    // تطبيق iOS: يفعّل/يلغي القفل التلقائي (MainViewController.swift).
    try { window.webkit.messageHandlers.keepAwake.postMessage(!!on); } catch(e){}
    if (!('wakeLock' in navigator)) return;
    try {
      if (on && !wakeLock) {
        const lock = await navigator.wakeLock.request('screen');
        if (!recording || wakeLock) { lock.release().catch(() => {}); return; }
        wakeLock = lock;
        lock.addEventListener('release', () => { if (wakeLock === lock) wakeLock = null; });
      } else if (!on && wakeLock) {
        const lock = wakeLock; wakeLock = null;
        await lock.release();
      }
    } catch(e){}
  }

  let starting = false;
  async function startRecording(){
    if (recording || starting) return;
    starting = true;
    ensureAudioCtx();
    let s;
    try {
      s = await openMic();
    } catch (e) {
      showToast(UI_TEXT[uiLang].micDenied, 5000);
      return;
    } finally {
      starting = false;
    }
    session++;
    recording = true;
    mediaStream = s;
    lines = [];
    noiseFloor = 0.002;
    mutedSince = 0;
    mainBtn.classList.add('recording');
    mainBtn.textContent = '⏹️';
    mainBtnLabel.textContent = UI_TEXT[uiLang].mainBtnLabelStop;
    ccStage.classList.remove('idle');
    ccStage.innerHTML = '<span class="cc-badge"><span class="dot"></span>LIVE</span><div class="cc-line translated">…</div>';
    keepScreenOn(true);
    recordLoop();
  }

  function stopRecording(){
    session++;
    recording = false;
    if (chunkTimer) clearTimeout(chunkTimer);
    const rec = mediaRecorder; mediaRecorder = null;
    try { if (rec && rec.state !== 'inactive') rec.stop(); } catch(e){}
    releaseMic();
    if (vadSource) { try { vadSource.disconnect(); } catch(e){} vadSource = null; analyser = null; }
    if (audioCtx && audioCtx.state === 'running') audioCtx.suspend().catch(() => {});
    keepScreenOn(false);
    mainBtn.classList.remove('recording');
    mainBtn.textContent = '🎤';
    mainBtnLabel.textContent = UI_TEXT[uiLang].mainBtnLabel;
    ccStage.classList.add('idle');
    ccStage.innerHTML = '<span id="ccIdleText">' + UI_TEXT[uiLang].ccIdle + '</span>';
  }

  mainBtn.addEventListener('click', () => {
    if (recording) stopRecording(); else startRecording();
  });

  // ---------------- Go Premium (placeholder) ----------------
  $('premiumBtn').addEventListener('click', () => {
    showToast(uiLang === 'ar' ? 'خطط الاشتراك قريبًا! 🚀' : 'Premium plans coming soon! 🚀', 3500);
  });

  // ---------------- PWA install ----------------
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    $('installBtn').style.display = 'inline-flex';
  });
  $('installBtn').addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    $('installBtn').style.display = 'none';
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  applyUiLang();
})();
</script>
<script>
(function(){
  var canvas = document.getElementById('bgCanvas');
  var ctx = canvas.getContext('2d');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);

  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // Floating multilingual glyphs with pseudo-3D depth (parallax by z)
  var chars = ['A','ا','文','अ','ب','あ','ن','ر','ی','ま','ह','ت','ी','ラ','ñ','Ω'];
  var particles = [];
  var count = Math.max(14, Math.min(34, Math.floor((W*H)/45000)));
  function makeParticle(){
    return {
      x: Math.random()*W,
      y: Math.random()*H,
      z: 0.3 + Math.random()*0.9, // depth: smaller = farther
      ch: chars[Math.floor(Math.random()*chars.length)],
      vy: 0.15 + Math.random()*0.35,
      drift: (Math.random()-0.5)*0.3,
      rot: Math.random()*Math.PI*2,
      vr: (Math.random()-0.5)*0.01
    };
  }
  for(var i=0;i<count;i++) particles.push(makeParticle());

  // Waveform bars (simulated audio waveform, bottom of screen)
  var barCount = 48;
  var bars = [];
  for(var b=0;b<barCount;b++) bars.push(Math.random());

  var t = 0;

  function drawWave(baseY, amp, hue, alpha, speed){
    ctx.save();
    ctx.globalAlpha = alpha;
    var gap = W/barCount;
    for(var i=0;i<barCount;i++){
      var phase = t*speed + i*0.35;
      var h = (Math.sin(phase) * 0.5 + 0.5) * amp * (0.4+bars[i]*0.6) + 6;
      var x = i*gap;
      var grad = ctx.createLinearGradient(0, baseY-h, 0, baseY+h);
      grad.addColorStop(0, 'hsla('+hue+',85%,65%,0)');
      grad.addColorStop(0.5, 'hsla('+hue+',85%,65%,1)');
      grad.addColorStop(1, 'hsla('+hue+',85%,65%,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(x, baseY-h, gap*0.6, h*2);
    }
    ctx.restore();
  }

  function frame(){
    t += 0.016;
    ctx.clearRect(0,0,W,H);

    // subtle 3D grid horizon (perspective floor)
    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.strokeStyle = '#1a73e8';
    var horizon = H*0.62;
    for(var g=1; g<=10; g++){
      var yy = horizon + (H-horizon) * (g/10) * (g/10);
      ctx.beginPath();
      ctx.moveTo(0, yy);
      ctx.lineTo(W, yy);
      ctx.stroke();
    }
    ctx.restore();

    // floating multilingual glyphs (pseudo-3D via depth z)
    for(var p=0;p<particles.length;p++){
      var pt = particles[p];
      pt.y -= pt.vy * pt.z;
      pt.x += pt.drift * pt.z;
      pt.rot += pt.vr;
      if(pt.y < -40){ pt.y = H+40; pt.x = Math.random()*W; }
      if(pt.x < -40) pt.x = W+40;
      if(pt.x > W+40) pt.x = -40;

      var size = 14 + pt.z*26;
      ctx.save();
      ctx.translate(pt.x, pt.y);
      ctx.rotate(pt.rot);
      ctx.globalAlpha = 0.08 + pt.z*0.22;
      ctx.font = '600 '+size+'px system-ui,sans-serif';
      ctx.fillStyle = pt.z>0.7 ? '#8ab4f8' : '#fbbc04';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(pt.ch, 0, 0);
      ctx.restore();
    }

    // dual-tone waveform representing voice + translation
    drawWave(H*0.78, 46, 214, 0.85, 1.6);
    drawWave(H*0.86, 30, 44, 0.55, 2.1);

    if(!reduceMotion) requestAnimationFrame(frame);
  }

  if(reduceMotion){
    frame(); // draw one static frame only
  } else {
    requestAnimationFrame(frame);
    document.addEventListener('visibilitychange', function(){
      if(!document.hidden) requestAnimationFrame(frame);
    });
  }
})();
</script>
</body>
