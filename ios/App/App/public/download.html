<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Omran Caption - تحميل التطبيق</title>
<meta name="theme-color" content="#1a73e8" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/favicon-32.png" />
<style>
  :root{
    --bg:#0b0c10;
    --panel:#16181d;
    --panel2:#1e2127;
    --border:#2a2d34;
    --text:#e8eaed;
    --muted:#9aa0a6;
    --accent:#1a73e8;
    --accent2:#8ab4f8;
    --gold:#fbbc04;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:radial-gradient(circle at 50% 0%, #14243a 0%, var(--bg) 60%);
    color:var(--text);
    font-family:"Segoe UI",Tahoma,"Cairo",system-ui,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:20px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:36px 28px;
    max-width:420px;
    width:100%;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .logo{
    width:88px;height:88px;border-radius:22px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 18px;
    font-size:40px;
  }
  h1{font-size:22px;margin:0 0 6px;}
  p.sub{color:var(--muted);font-size:14px;margin:0 0 26px;line-height:1.7;}
  .btn{
    display:block;
    width:100%;
    padding:16px;
    border-radius:14px;
    background:linear-gradient(135deg,var(--accent),#1557b0);
    color:#fff;
    font-size:17px;
    font-weight:700;
    text-decoration:none;
    box-shadow:0 8px 24px rgba(26,115,232,.4);
    transition:transform .15s;
  }
  .btn:active{transform:scale(.97);}
  .meta{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
    font-size:12px;
    color:var(--muted);
    border-top:1px solid var(--border);
    padding-top:16px;
  }
  .note{
    margin-top:20px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    font-size:12.5px;
    color:var(--muted);
    text-align:right;
    line-height:1.8;
  }
  .note b{color:var(--gold);}
  footer{
    margin-top:22px;
    font-size:12px;
    color:var(--muted);
  }
  a.link{color:var(--accent2);text-decoration:none;}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🎬</div>
    <h1>Omran Caption</h1>
    <p class="sub">ترجمة نصوص حية فورية لصوت جهازك — تطبيق أندرويد من عمران</p>

    <a class="btn" href="https://6tfgxvttzyoiavtu.public.blob.vercel-storage.com/omran-caption-Xe4TcMRrfCvQcYLI2IkBkz8uKs3vTb.apk?download=1" download="OmranCaption.apk">
      ⬇️ تحميل التطبيق (APK)
    </a>

    <div class="meta">
      <span>الحجم: 13 MB تقريبًا</span>
      <span>أندرويد 8 وما فوق</span>
    </div>

    <div class="note">
      ⚠️ <b>ملاحظة:</b> عند التثبيت لأول مرة قد يطلب منك الجهاز السماح بـ"التثبيت من مصادر غير معروفة" — وافق على ذلك، التطبيق آمن 100%.
    </div>

    <footer>by عمران &middot; <a class="link" href="index.html">الموقع الرئيسي</a></footer>
  </div>
</body>
</html>
